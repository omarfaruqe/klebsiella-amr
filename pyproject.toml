[project]
name = "klebsiella-amr"
version = "0.1.0"
description = "Genotype-phenotype concordance pipeline and leakage-aware benchmark for Klebsiella pneumoniae AMR"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "requests>=2.32", "pyarrow>=16", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
